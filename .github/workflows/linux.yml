name: Linux reader
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-linux.txt pytest
      - run: PYTHONPATH=src pytest -q tests/test_linux_support.py tests/test_linux_startup.py tests/test_wechat_decrypt_key_modes.py tests/test_image_key_memory_scan.py tests/test_image_key_resolver.py tests/test_image_key_verified_store.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run generate
        working-directory: frontend
        env:
          NUXT_APP_BASE_URL: /analysis/
          NUXT_PUBLIC_API_BASE: /analysis/api
